<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Napoléon Bonaparte — Avatar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

    :root {
      --gold: #c9a84c;
      --gold-dim: #8a6f34;
      --bg: #0c0a08;
      --surface: #15120d;
      --surface2: #1d1810;
      --border: #2e2618;
      --text: #e8dfc8;
      --text-dim: #9a8e78;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: grid;
      grid-template-columns: 1fr 380px;
      grid-template-rows: 1fr;
      gap: 0;
      overflow: hidden;
    }

    /* ── Avatar panel ────────────────────────────────────────────────── */
    #avatar-panel {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    #avatar-canvas {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 35% 25%, #2a1f0d 0%, #120e08 55%, #0c0a08 100%);
    }

    #avatar-canvas canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Title overlay */
    #title-overlay {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 2;
    }

    #title-overlay h1 {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 2px 12px rgba(201, 168, 76, 0.35);
    }

    #title-overlay p {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-top: 4px;
    }

    /* Status bar */
    #status-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 12, 8, 0.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 76, 0.25);
      white-space: nowrap;
      z-index: 2;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold-dim);
      flex: 0 0 auto;
      transition: background 0.3s;
    }

    .status-dot.ready {
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2);
    }

    #status-text {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    /* ── Chat panel ──────────────────────────────────────────────────── */
    #chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: var(--surface2);
      border-left: 1px solid var(--border);
    }

    #chat-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    #chat-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    #chat-header h2 {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    #chat-header p {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
      font-family: system-ui, sans-serif;
      line-height: 1.4;
    }

    #chat-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
      max-width: 180px;
    }

    .chat-action {
      min-height: 32px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 11px;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    #settings-btn {
      flex-basis: 100%;
    }

    .flag {
      width: 18px;
      height: 12px;
      flex: 0 0 auto;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    /* L'attribut hidden l'emporte sur les display: flex/grid des composants */
    [hidden] { display: none !important; }

    /* ── Paramètres ─────────────────────────────────────────────────── */
    #settings-dialog {
      margin: auto;   /* la remise à zéro globale des marges annule le centrage natif */
      width: min(540px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      font-family: system-ui, sans-serif;
    }

    #settings-dialog::backdrop {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
    }

    #settings-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px;
    }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-head h3 {
      font-family: Georgia, serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    #settings-close {
      background: none;
      border: 0;
      color: var(--text-dim);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    #settings-close:hover,
    #settings-close:focus-visible { color: var(--gold); }

    .settings-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-section h4 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .settings-note {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-dim);
    }

    .settings-note a { color: var(--gold); }

    #lang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 6px;
    }

    .lang-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .lang-option:hover,
    .lang-option:focus-visible { border-color: var(--gold-dim); outline: none; }

    .lang-option[aria-pressed="true"] {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(201, 168, 76, 0.12);
    }

    .key-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
    }

    .key-field span {
      display: flex;
      justify-content: space-between;
      color: var(--text);
    }

    .key-state { color: var(--gold); }

    .key-field input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: ui-monospace, Consolas, monospace;
    }

    .key-field input:focus { outline: none; border-color: var(--gold-dim); }

    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: none;
      color: var(--text-dim);
      vertical-align: 1px;
    }

    .badge.required { color: var(--gold); border-color: var(--gold-dim); }

    .key-field select {
      width: 100%;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }

    .key-field select option { background: var(--surface2); }
    .key-field select:focus { outline: none; border-color: var(--gold-dim); }

    .model-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .model-row { grid-template-columns: 1fr; }
    }

    .settings-inline {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }

    .settings-inline a { color: var(--gold); }

    #settings-dialog .settings-section + .settings-section {
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .settings-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settings-message {
      font-size: 12px;
      color: var(--text-dim);
      min-height: 1em;
    }

    .settings-message.ok { color: var(--gold); }
    .settings-message.error { color: #ff8a7a; }

    #record-btn.recording {
      color: #ff6b5e;
      border-color: rgba(255, 107, 94, 0.6);
      background: rgba(255, 107, 94, 0.12);
      animation: record-pulse 1.6s ease-in-out infinite;
    }

    @keyframes record-pulse {
      50% { border-color: rgba(255, 107, 94, 0.2); }
    }

    @media (prefers-reduced-motion: reduce) {
      #record-btn.recording { animation: none; }
    }

    .chat-action.primary {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(201, 168, 76, 0.12);
    }

    .chat-action:hover:not(:disabled) {
      border-color: var(--gold-dim);
      color: var(--gold);
    }

    .chat-action:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    #chat-log {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .bubble {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
      font-family: system-ui, sans-serif;
    }

    .bubble-user {
      align-self: flex-end;
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid rgba(201, 168, 76, 0.25);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }

    .bubble-napoleon {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
      font-style: italic;
    }

    .source-toggle {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding-top: 7px;
      border: none;
      border-top: 1px solid rgba(201, 168, 76, 0.15);
      background: none;
      text-align: left;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0.6;
      font-style: normal;
      transition: opacity 0.15s;
    }
    .source-toggle:hover { opacity: 1; }

    .source-panel {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .source-panel[hidden] { display: none; }

    .source-item {
      display: flex;
      gap: 8px;
      align-items: baseline;
      font-size: 11px;
      font-style: normal;
    }
    .source-date {
      color: var(--gold);
      font-weight: 600;
      min-width: 86px;
      flex-shrink: 0;
    }
    .source-snippet {
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .source-link {
      color: var(--gold);
      opacity: 0.7;
      text-decoration: none;
      flex-shrink: 0;
      font-size: 10px;
      letter-spacing: 0.03em;
    }
    .source-link:hover { opacity: 1; text-decoration: underline; }

    .bubble-system {
      align-self: center;
      max-width: 100%;
      background: transparent;
      border: 1px solid rgba(201, 168, 76, 0.18);
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      font-style: normal;
    }

    /* Chat form */
    #chat-footer {
      flex: 0 0 auto;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }

    #chat-form {
      display: flex;
      gap: 8px;
    }

    #chat-input {
      flex: 1 1 auto;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
    }

    #chat-input:focus {
      border-color: var(--gold-dim);
    }

    #chat-input::placeholder {
      color: var(--text-dim);
    }

    #chat-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #send-btn {
      flex: 0 0 auto;
      padding: 10px 16px;
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      color: var(--gold);
      font-size: 13px;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      letter-spacing: 0.04em;
    }

    #send-btn:hover:not(:disabled) {
      background: rgba(201, 168, 76, 0.22);
    }

    #send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Context bubble ──────────────────────────────────────────────── */
    #context-episode {
      font-size: 20px;
      line-height: 1.3;
      color: var(--gold);
      text-shadow: 0 2px 10px rgba(201, 168, 76, 0.25);
    }

    #context-periode {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold-dim);
    }

    #context-chapitre {
      font-size: 16px;
      line-height: 1.4;
      font-style: italic;
      color: var(--text);
      padding-top: 10px;
      border-top: 1px solid rgba(201, 168, 76, 0.22);
    }

    #context-episode:empty, #context-periode:empty,
    #context-chapitre:empty, #context-lettres:empty { display: none; }

    #context-lettres {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-dim);
    }

    .context-letter-date {
      color: var(--gold);
      font-weight: 600;
    }

    /* Grand encadré de repères, sans défilement : il prend la hauteur de son contenu */
    #context-bubble {
      position: absolute;
      top: 20px;
      left: 20px;
      width: clamp(280px, 30%, 420px);
      padding: 18px 22px;
      border-radius: 14px;
      background: rgba(12, 10, 8, 0.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 76, 0.28);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: visible;
    }

    #context-bubble[hidden] { display: none; }

    #context-count {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      padding-top: 10px;
      border-top: 1px solid rgba(201, 168, 76, 0.22);
    }

    #context-count:empty, #context-text:empty { display: none; }

    #context-text {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-dim);
    }

    /* ── Responsive ──────────────────────────────────────────────────── */
    /* Résumé court des réponses : affiché seulement sur mobile (voir plus bas) */
    .bubble-summary { display: none; }
    #transcript-btn { display: none; }

    /* Mobile : l'avatar occupe tout l'écran ; par-dessus, des repères réduits et un dialogue compact
       (petites bulles qui résument les réponses, le texte intégral reste accessible par un bouton). */
    @media (max-width: 680px) {
      body { display: block; }
      #avatar-panel {
        position: fixed;
        inset: 0;
        border: none;
      }
      #title-overlay { top: 10px; }
      #title-overlay { width: 100%; }
      #title-overlay h1 { font-size: 13px; letter-spacing: 0.14em; white-space: nowrap; }
      #title-overlay p { display: none; }
      #status-bar {
        top: 34px;
        bottom: auto;
        padding: 4px 10px;
      }
      #status-text { font-size: 10px; }
      #context-bubble {
        top: 66px;
        left: 10px;
        width: calc(100% - 20px);
        padding: 8px 12px;
        gap: 3px;
        border-radius: 10px;
        background: rgba(12, 10, 8, 0.72);
        box-shadow: none;
      }
      #context-episode { font-size: 13px; line-height: 1.3; }
      #context-periode { font-size: 10px; }
      #context-chapitre { font-size: 12px; padding-top: 4px; }
      #context-lettres, #context-count, #context-text { display: none !important; }

      #chat-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 46dvh;
        z-index: 3;
        border: none;
        background: linear-gradient(to top, rgba(12, 10, 8, 0.96) 55%, rgba(12, 10, 8, 0));
      }
      #chat-header { padding: 4px 10px 0; border: none; }
      #chat-header-row > div:first-child { display: none; }
      #chat-actions {
        flex: 1 1 auto;
        max-width: none;
        justify-content: center;
        gap: 6px;
      }
      #settings-btn { flex-basis: auto; }
      #chat-actions .chat-action { min-height: 28px; padding: 5px 9px; }
      #transcript-btn { display: inline-block; }
      #chat-log {
        flex: 0 1 auto;
        max-height: 24dvh;
        padding: 6px 10px;
        gap: 6px;
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 28%);
        mask-image: linear-gradient(to bottom, transparent, #000 28%);
      }
      .bubble {
        max-width: 86%;
        padding: 6px 10px;
        font-size: 12px;
        line-height: 1.4;
        background: rgba(12, 10, 8, 0.6);
      }
      .bubble-system { font-size: 11px; padding: 4px 8px; }
      body:not(.show-transcript) .bubble-summary { display: block; }
      body:not(.show-transcript) .bubble-full { display: none; }
      body.show-transcript #chat-panel { max-height: 70dvh; background: rgba(12, 10, 8, 0.94); }
      body.show-transcript #chat-log { max-height: 50dvh; -webkit-mask-image: none; mask-image: none; }
      .source-toggle { margin-top: 4px; padding-top: 4px; }
      #chat-footer {
        padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
        border: none;
      }
      #chat-input { font-size: 16px; padding: 8px 10px; }   /* 16px : pas de zoom automatique sur iOS */
      #send-btn { padding: 8px 12px; }
    }
  </style>
</head>
<body>

  <!-- Avatar panel -->
  <div id="avatar-panel">
    <div id="avatar-canvas"></div>

    <div id="title-overlay">
      <h1>Napoléon Bonaparte</h1>
      <p data-i18n="subtitle">Empereur des Français · 1769 – 1821</p>
    </div>

    <div id="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Initialisation…</span>
    </div>

    <div id="context-bubble" hidden>
      <div id="context-episode"></div>
      <div id="context-periode"></div>
      <div id="context-chapitre"></div>
      <ul id="context-lettres"></ul>
      <div id="context-count"></div>
      <div id="context-text"></div>
    </div>
  </div>

  <!-- Chat panel -->
  <div id="chat-panel">
    <div id="chat-header">
      <div id="chat-header-row">
        <div>
          <h2 data-i18n="chatTitle">Dialogue impérial</h2>
          <p data-i18n="chatIntro">Interrogez l'Empereur sur sa vie, ses campagnes et son empire.</p>
        </div>
        <div id="chat-actions">
          <button type="button" id="settings-btn" class="chat-action" data-i18n="settings">⚙ Paramètres</button>
          <button type="button" id="start-conversation-btn" class="chat-action primary" data-i18n="start">Commencer</button>
          <button type="button" id="end-conversation-btn" class="chat-action" data-i18n="end">Finir</button>
          <button type="button" id="reset-conversation-btn" class="chat-action" data-i18n="reset">Reset</button>
          <button type="button" id="record-btn" class="chat-action" data-i18n="record" hidden>● Enregistrer</button>
          <button type="button" id="transcript-btn" class="chat-action" aria-pressed="false">📜 <span data-i18n="transcript">Texte</span></button>
        </div>
      </div>
    </div>

    <div id="chat-log"></div>

    <div id="chat-footer">
      <form id="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="Posez votre question à l'Empereur…"
          autocomplete="off"
          disabled
        />
        <button type="submit" id="send-btn" disabled data-i18n="send">Envoyer</button>
      </form>
    </div>
  </div>


  <!-- Paramètres : langue et clés API (enregistrées dans le .env local) -->
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form" method="dialog">
      <div class="settings-head">
        <h3 id="settings-title" data-i18n="settingsTitle">Paramètres</h3>
        <button type="button" id="settings-close" data-i18n-aria="close" aria-label="Fermer">×</button>
      </div>

      <section class="settings-section">
        <h4 data-i18n="language">Langue</h4>
        <div id="lang-grid"></div>
      </section>

      <section class="settings-section" id="agent-section">
        <h4><span data-i18n="agentTitle">Modèle de l'agent</span> <span class="badge required" data-i18n="required">requis</span></h4>
        <p class="settings-note" data-i18n="agentIntro"></p>
        <label class="key-field">
          <span data-i18n="provider">Fournisseur</span>
          <select id="llm-provider"></select>
        </label>
        <label class="key-field" id="llm-url-field">
          <span data-i18n="baseUrl">URL de l'API</span>
          <input type="url" id="llm-base-url" autocomplete="off" spellcheck="false" placeholder="https://…/v1" />
        </label>
        <label class="key-field" id="llm-key-field">
          <span><span data-i18n="apiKey">Clé API</span><span class="key-state" id="llm-state"></span></span>
          <input type="password" id="llm-key" autocomplete="off" spellcheck="false" />
        </label>
        <div class="model-row">
          <label class="key-field">
            <span data-i18n="agentModel">Modèle de l'archiviste</span>
            <select id="agent-model"></select>
          </label>
          <label class="key-field">
            <span data-i18n="narratorModel">Modèle du narrateur</span>
            <select id="narrator-model"></select>
          </label>
        </div>
        <div class="settings-inline">
          <button type="button" id="llm-load-models" class="chat-action" data-i18n="refreshModels">↻ Actualiser la liste</button>
          <a id="llm-key-link" href="#" target="_blank" rel="noopener" data-i18n="getKey"></a>
        </div>
        <p class="settings-note" data-i18n="modelHint"></p>
        <label class="key-field" id="embedding-field">
          <span><span data-i18n="embeddingKey">Clé OpenAI pour la recherche sémantique</span> <span class="badge" data-i18n="optional">optionnel</span><span class="key-state" id="embedding-state"></span></span>
          <input type="password" id="embedding-key" autocomplete="off" spellcheck="false" />
          <span class="settings-note" data-i18n="embeddingHint"></span>
        </label>
      </section>

      <!-- Voix Azure : utile seulement avec un avatar 3D (synchronisation labiale) ; masquée sinon -->
      <section class="settings-section" id="voice-section" hidden>
        <h4><span data-i18n="voiceTitle">Voix Azure Speech</span> <span class="badge" data-i18n="optional">optionnel</span></h4>
        <p class="settings-note" data-i18n="voiceIntro"></p>
        <label class="key-field">
          <span><span data-i18n="azureKey">Clé Azure Speech</span><span class="key-state" id="azure-state"></span></span>
          <input type="password" id="azure-key" autocomplete="off" spellcheck="false" />
        </label>
        <label class="key-field">
          <span data-i18n="azureRegion">Région Azure</span>
          <input type="text" id="azure-region" autocomplete="off" spellcheck="false" placeholder="francecentral" />
        </label>
        <p class="settings-note">
          <a href="https://portal.azure.com/#create/Microsoft.CognitiveServicesSpeechServices" target="_blank" rel="noopener" data-i18n="getAzureKey"></a>
        </p>
      </section>

      <section class="settings-section" id="avatar-section">
        <h4><span data-i18n="avatarTitle">Avatar 3D</span> <span class="badge" data-i18n="optional">optionnel</span></h4>
        <p class="settings-note" id="avatar-note"></p>
      </section>

      <div class="settings-actions" id="settings-actions">
        <span id="settings-message" class="settings-message" role="status"></span>
        <button type="submit" id="settings-save" class="chat-action primary" data-i18n="save">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
