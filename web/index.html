<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
  <title>Napoléon Bonaparte — Avatar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

    :root {
      --gold: #c9a84c;
      --gold-dim: #8a6f34;
      --bg: #0c0a08;
      --surface: #15120d;
      --surface2: #1d1810;
      --border: #2e2618;
      --text: #e8dfc8;
      --text-dim: #9a8e78;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: grid;
      grid-template-columns: 1fr 380px;
      grid-template-rows: 1fr;
      gap: 0;
      overflow: hidden;
    }

    /* ── Avatar panel ────────────────────────────────────────────────── */
    #avatar-panel {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    #avatar-canvas {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 35% 25%, #2a1f0d 0%, #120e08 55%, #0c0a08 100%);
    }

    #avatar-canvas canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Title overlay */
    #title-overlay {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 2;
    }

    #title-overlay h1 {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 2px 12px rgba(201, 168, 76, 0.35);
    }

    #title-overlay p {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-top: 4px;
    }

    /* Décor de Longwood (papier peint jaune) : titre à l'encre brune, halo clair */
    .with-decor #title-overlay h1 {
      color: #2b1c0c;
      text-shadow: 0 0 10px rgba(255, 243, 214, 0.75), 0 1px 2px rgba(255, 243, 214, 0.6);
    }
    .with-decor #title-overlay p {
      color: #4a3518;
      text-shadow: 0 0 8px rgba(255, 243, 214, 0.7);
    }

    /* Ambiance coupée : bouton estompé */

    /* Vignette : les bords de l'image s'assombrissent, le regard va à Napoléon */
    #avatar-canvas::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 75% 70% at 50% 45%, transparent 55%, rgba(8, 6, 4, var(--vignette, 0.5)) 100%);
    }

    /* Status bar */
    #status-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 12, 8, 0.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 76, 0.25);
      white-space: nowrap;
      z-index: 2;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold-dim);
      flex: 0 0 auto;
      transition: background 0.3s;
    }

    .status-dot.ready {
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2);
    }

    #status-text {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    /* ── Chat panel ──────────────────────────────────────────────────── */
    #chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: var(--surface2);
      border-left: 1px solid var(--border);
    }

    #chat-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    #chat-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    #chat-header h2 {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    #chat-header p {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
      font-family: system-ui, sans-serif;
      line-height: 1.4;
    }

    #chat-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
      max-width: 180px;
    }

    .chat-action {
      min-height: 32px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 11px;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    #settings-btn {
      flex-basis: 100%;
    }

    .flag {
      width: 18px;
      height: 12px;
      flex: 0 0 auto;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    /* L'attribut hidden l'emporte sur les display: flex/grid des composants */
    [hidden] { display: none !important; }

    /* ── Paramètres ─────────────────────────────────────────────────── */
    #settings-dialog {
      margin: auto;   /* la remise à zéro globale des marges annule le centrage natif */
      width: min(540px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      font-family: system-ui, sans-serif;
    }

    #settings-dialog::backdrop {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
    }

    #settings-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px;
    }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-head h3 {
      font-family: Georgia, serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    #settings-close {
      background: none;
      border: 0;
      color: var(--text-dim);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    #settings-close:hover,
    #settings-close:focus-visible { color: var(--gold); }

    .settings-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-section h4 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .settings-note {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-dim);
    }

    .settings-note a { color: var(--gold); }

    #lang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 6px;
    }

    .lang-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .lang-option:hover,
    .lang-option:focus-visible { border-color: var(--gold-dim); outline: none; }

    .lang-option[aria-pressed="true"] {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(201, 168, 76, 0.12);
    }

    .key-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
    }

    .key-field span {
      display: flex;
      justify-content: space-between;
      color: var(--text);
    }

    .key-state { color: var(--gold); }

    .key-field input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: ui-monospace, Consolas, monospace;
    }

    .key-field input:focus { outline: none; border-color: var(--gold-dim); }

    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: none;
      color: var(--text-dim);
      vertical-align: 1px;
    }

    .badge.required { color: var(--gold); border-color: var(--gold-dim); }

    .key-field select {
      width: 100%;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }

    .key-field select option { background: var(--surface2); }
    .key-field select:focus { outline: none; border-color: var(--gold-dim); }

    .model-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .model-row { grid-template-columns: 1fr; }
    }

    .settings-inline {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }

    .settings-inline a { color: var(--gold); }

    #settings-dialog .settings-section + .settings-section {
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .settings-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settings-message {
      font-size: 12px;
      color: var(--text-dim);
      min-height: 1em;
    }

    .settings-message.ok { color: var(--gold); }
    .settings-message.error { color: #ff8a7a; }

    #record-btn.recording {
      color: #ff6b5e;
      border-color: rgba(255, 107, 94, 0.6);
      background: rgba(255, 107, 94, 0.12);
      animation: record-pulse 1.6s ease-in-out infinite;
    }

    @keyframes record-pulse {
      50% { border-color: rgba(255, 107, 94, 0.2); }
    }

    @media (prefers-reduced-motion: reduce) {
      #record-btn.recording { animation: none; }
    }

    .chat-action.primary {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(201, 168, 76, 0.12);
    }

    .chat-action:hover:not(:disabled) {
      border-color: var(--gold-dim);
      color: var(--gold);
    }

    .chat-action:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    #chat-log {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .bubble {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
      font-family: system-ui, sans-serif;
    }

    .bubble-user {
      align-self: flex-end;
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid rgba(201, 168, 76, 0.25);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }

    .bubble-napoleon {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
      font-style: italic;
    }

    .source-toggle {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding-top: 7px;
      border: none;
      border-top: 1px solid rgba(201, 168, 76, 0.15);
      background: none;
      text-align: left;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0.6;
      font-style: normal;
      transition: opacity 0.15s;
    }
    .source-toggle:hover { opacity: 1; }

    .source-panel {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .source-panel[hidden] { display: none; }

    .source-item {
      display: flex;
      gap: 8px;
      align-items: baseline;
      font-size: 11px;
      font-style: normal;
      color: var(--text);
      text-decoration: none;
      border-radius: 6px;
    }
    a.source-item:hover .source-title,
    a.source-item:focus-visible .source-title { color: var(--gold); }
    .source-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-dim);
    }
    .source-date {
      color: var(--gold);
      font-weight: 600;
      min-width: 86px;
      flex-shrink: 0;
    }
    .source-snippet {
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .source-link {
      color: var(--gold);
      opacity: 0.7;
      text-decoration: none;
      flex-shrink: 0;
      font-size: 10px;
      letter-spacing: 0.03em;
    }
    .source-link:hover { opacity: 1; text-decoration: underline; }

    /* Sous-titres : seulement sur mobile (sur ordinateur, le texte est dans le fil) */
    #subtitles { display: none; }

    /* « Nouvelle conversation » : deuxième clic pour confirmer */
    #new-conversation-btn.confirm {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(201, 168, 76, 0.12);
    }

    .bubble-welcome {
      color: var(--text);
      line-height: 1.6;
    }

    .bubble-system {
      align-self: center;
      max-width: 100%;
      background: transparent;
      border: 1px solid rgba(201, 168, 76, 0.18);
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      font-style: normal;
    }

    /* Chat form */
    #chat-footer {
      flex: 0 0 auto;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }

    #chat-form {
      display: flex;
      gap: 8px;
    }

    #chat-input {
      flex: 1 1 auto;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
    }

    #chat-input:focus {
      border-color: var(--gold-dim);
    }

    #chat-input::placeholder {
      color: var(--text-dim);
    }

    #chat-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #send-btn {
      flex: 0 0 auto;
      padding: 10px 16px;
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      color: var(--gold);
      font-size: 13px;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      letter-spacing: 0.04em;
    }

    #send-btn:hover:not(:disabled) {
      background: rgba(201, 168, 76, 0.22);
    }

    #send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #send-btn.stop {
      color: var(--text);
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.06);
    }

    /* ── Context bubble ──────────────────────────────────────────────── */
    #context-episode {
      font-size: 16px;
      line-height: 1.3;
      color: var(--gold);
      text-shadow: 0 2px 10px rgba(201, 168, 76, 0.25);
    }

    #context-periode {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold-dim);
    }

    #context-chapitre {
      font-size: 13px;
      line-height: 1.4;
      font-style: italic;
      color: var(--text);
      padding-top: 6px;
      border-top: 1px solid rgba(201, 168, 76, 0.22);
    }

    #context-episode:empty, #context-periode:empty,
    #context-chapitre:empty, #context-lettres:empty, #context-lacune:empty { display: none; }

    /* Silence des archives entre deux lettres racontées (affiché, jamais raconté) */
    #context-lacune {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      font-style: italic;
      color: var(--text-dim);
      padding-left: 10px;
      border-left: 2px solid rgba(201, 168, 76, 0.35);
    }

    #context-lettres {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      color: var(--text-dim);
    }

    .context-letter-date {
      color: var(--gold);
      font-weight: 600;
    }

    /* Encadré de repères, étroit pour ne pas cacher Napoléon : épisode, période, chapitre et lettres ;
       le nombre de lettres et le contexte de l'épisode se déplient d'un clic (classe « open ») */
    #context-bubble {
      position: absolute;
      top: 16px;
      left: 16px;
      width: clamp(230px, 22%, 320px);
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(12, 10, 8, 0.78);
      cursor: pointer;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 76, 0.28);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: visible;
    }

    #context-bubble[hidden] { display: none; }

    /* Œuvre du tableau mural en grand (clic sur l'œuvre) ; un clic ou Échap referme */
    #painting-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(8, 6, 4, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px 16px;
      cursor: zoom-out;
    }
    #painting-overlay[hidden] { display: none; }

    /* Lettre entière (clic sur une lettre épinglée) : feuille de papier, défilante ; un clic hors de la feuille
       ou Échap referme */
    #letter-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(8, 6, 4, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    #letter-overlay[hidden] { display: none; }
    /* Ligne d'une source dans la conversation : bouton qui ouvre la lettre entière */
    .source-open { all: unset; cursor: pointer; display: contents; }
    .source-open:hover .source-title { text-decoration: underline; }
    /* Feuille de lettre ancienne : papier vergé jauni, bords brunis, taches, encre brune, typographie ancienne */
    #letter-sheet {
      width: min(680px, 100%);
      max-height: calc(100dvh - 48px);
      overflow-y: auto;
      padding: 44px 52px 40px;
      border-radius: 2px;
      color: #3a2412;
      background:
        radial-gradient(ellipse 18% 12% at 82% 14%, rgba(150, 105, 50, 0.13), transparent 70%),
        radial-gradient(ellipse 14% 10% at 12% 78%, rgba(140, 95, 45, 0.11), transparent 70%),
        radial-gradient(ellipse 120% 90% at 50% 45%, transparent 55%, rgba(120, 80, 35, 0.35) 100%),
        repeating-linear-gradient(90deg, rgba(90, 60, 25, 0.025) 0 1px, transparent 1px 7px),
        linear-gradient(170deg, #f1e3bd, #e6d2a2 60%, #dcc48e);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.65), inset 0 0 60px rgba(110, 70, 25, 0.25);
      font: 17.5px/1.7 "IM Fell English", "Palatino Linotype", Palatino, "Book Antiqua", Garamond, Georgia, serif;
      text-align: justify;
      hyphens: auto;
    }
    #letter-sheet h3 {
      margin: 0 0 22px;
      text-align: right;
      font-size: 19px;
      font-style: italic;
      font-weight: normal;
      color: #4a2e14;
    }
    #letter-sheet .letter-to {
      margin: 0 0 22px;
      font-size: 15px;
      font-variant: small-caps;
      letter-spacing: 0.08em;
      color: #5a3818;
    }
    #letter-sheet .letter-body { white-space: pre-line; }
    #letter-sheet .letter-foot {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 22px;
      font-style: italic;
      color: #5a3818;
    }
    #letter-sheet .letter-foot .letter-link { margin: 0 0 0 auto; }
    #letter-sheet .letter-nav {
      border: 1px solid rgba(90, 56, 24, 0.5);
      background: rgba(255, 248, 225, 0.5);
      color: #4a2e14;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font: 20px/1 Georgia, serif;
      cursor: pointer;
    }
    #letter-sheet .letter-nav:disabled { opacity: 0.3; cursor: default; }
    #letter-sheet .letter-body.continued::first-letter { float: none; font-size: inherit; padding: 0; color: inherit; }
    #letter-sheet .letter-body::first-letter {
      float: left;
      font-size: 3.4em;
      line-height: 0.85;
      padding: 6px 8px 0 0;
      color: #6b2410;
    }
    #letter-sheet .letter-link {
      display: inline-block;
      margin-top: 26px;
      color: #7a3b10;
      font-size: 14px;
      font-style: italic;
    }
    @media (max-width: 680px) { #letter-sheet { padding: 28px 22px; font-size: 16px; } }

    /* Objet regardé de près : le titre et les notes s'effacent, le bouton de retour prend la place du titre */
    #title-overlay, #context-bubble, #status-bar { transition: opacity 0.4s; }
    #avatar-panel.inspecting #title-overlay,
    #avatar-panel.inspecting #context-bubble,
    #avatar-panel.inspecting #status-bar { opacity: 0; pointer-events: none; }

    /* Retour au récit après avoir regardé un objet de près */
    #inspect-back {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      z-index: 3;
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(201, 168, 76, 0.5);
      background: rgba(12, 10, 8, 0.82);
      color: var(--gold);
      font: 14px Georgia, serif;
      cursor: pointer;
    }
    #inspect-back[hidden] { display: none; }

    /* ── Mémoire du visiteur : noms mis en évidence, fiche, carte mentale ── */
    /* Avec le décor, la mémoire s'ouvre par la liasse des Mémoires posée sur le bureau : plus de bouton */
    .with-decor #memory-btn, body:has(.with-decor) #memory-btn { display: none; }
    .entite {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      border-bottom: 2px solid var(--gold);
      font-weight: 600;
    }
    .entite:hover, .entite:focus-visible { color: var(--gold); outline: none; }
    .entite-lieu { border-bottom-color: #6fa77d; }
    .entite-personne { border-bottom-color: #d0705c; }
    .entite-evenement { border-bottom-color: var(--gold); }
    .entite-institution { border-bottom-color: #7d9bd0; }
    #subtitles .entite-mot { border-bottom: 2px solid var(--gold); cursor: pointer; }
    #entites-fond {
      position: absolute;
      left: 16px;
      bottom: 64px;
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-start;
      gap: 6px;
      max-height: 45%;
      overflow: hidden;
      z-index: 2;
      pointer-events: none;
    }
    .entite-chip {
      pointer-events: auto;
      display: flex;
      gap: 6px;
      align-items: baseline;
      max-width: min(320px, 70vw);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(201, 168, 76, 0.45);
      background: rgba(12, 10, 8, 0.8);
      color: var(--text);
      font: 13px/1.3 Georgia, serif;
      cursor: pointer;
      text-align: left;
      animation: chip-in 0.35s ease-out;
    }
    .entite-chip small { color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entite-chip:hover { border-color: var(--gold); }
    @keyframes chip-in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    #entite-card {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      width: min(420px, calc(100vw - 32px));
      max-height: calc(100vh - 64px);
      overflow: auto;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--gold-dim);
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      font: 15px/1.5 Georgia, serif;
    }
    #entite-card[hidden] { display: none; }
    .entite-card-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
    .entite-card-head h4 { margin: 0 0 8px; font-size: 18px; }
    .entite-card-close { background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; line-height: 1; }
    .entite-card-meta { color: var(--text-dim); font-size: 13px; }
    .entite-card-liens { padding-left: 18px; margin: 8px 0; font-size: 14px; }
    .entite-card-liens li { margin: 3px 0; }
    .entite-card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .entite-card-note { color: var(--text-dim); font-size: 11px; margin: 10px 0 0; font-style: italic; }
    #memoire-dialog {
      width: min(1320px, calc(100vw - 24px));
      height: min(880px, calc(100vh - 24px));
      max-width: none;
      max-height: none;
      padding: 0;
      border: 1px solid var(--gold-dim);
      border-radius: 14px;
      background: radial-gradient(ellipse at 50% 40%, #1d1810 0%, #0c0a08 75%);
      color: var(--text);
      overflow: hidden;
    }
    #memoire-dialog[open] { display: flex; flex-direction: column; }
    #memoire-dialog::backdrop { background: rgba(0, 0, 0, 0.65); }
    .memoire-head { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .memoire-head h3 { margin: 0; margin-right: auto; font: 19px Georgia, serif; color: var(--gold); }
    .memoire-recherche { position: relative; flex: 0 1 360px; min-width: 0; }
    .memoire-recherche input { width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--gold-dim); background: var(--surface2); color: var(--text); font: 14px Georgia, serif; }
    .memoire-resultats { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; right: 0; max-height: 60vh; overflow: auto; margin: 0; padding: 6px; list-style: none; border-radius: 10px; border: 1px solid var(--gold-dim); background: var(--surface); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); }
    .memoire-resultats[hidden] { display: none; }
    .memoire-resultats button { display: flex; gap: 8px; width: 100%; align-items: baseline; padding: 6px 8px; border: none; border-radius: 6px; background: none; color: var(--text); font: 14px Georgia, serif; text-align: left; cursor: pointer; }
    .memoire-resultats button:hover { background: var(--surface2); }
    .memoire-res-nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .memoire-res-meta { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
    .memoire-legende { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 14px; font-size: 12px; color: var(--text-dim); }
    .memoire-legende i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .memoire-corps { flex: 1; min-height: 0; display: flex; }
    .memoire-zone { flex: 1; min-width: 0; position: relative; }
    .memoire-zone svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    .memoire-panneau { position: relative; width: min(380px, 42%); overflow: auto; padding: 16px 18px; border-left: 1px solid var(--border); background: rgba(21, 18, 13, 0.92); font: 14px/1.55 Georgia, serif; }
    .memoire-panneau[hidden] { display: none; }
    .memoire-panneau .entite-card-close { position: absolute; top: 8px; right: 10px; }
    .memoire-panneau h4 { margin: 0 24px 6px 0; font-size: 18px; }
    .memoire-panneau h5 { margin: 14px 0 4px; color: var(--gold); font: 13px Georgia, serif; text-transform: uppercase; letter-spacing: 0.06em; }
    .memoire-image { width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; margin: 6px 0; background: #000; }
    .memoire-resume { color: var(--text-dim); font-style: italic; }
    .memoire-texte { white-space: pre-wrap; max-height: 40vh; overflow: auto; padding: 10px 12px; border-radius: 8px; background: #efe5cc; color: #2b2116; font-size: 14px; }
    .memoire-voisins { list-style: none; padding: 0; margin: 0; }
    .memoire-voisins li { margin: 4px 0; }
    .memoire-voisins .entite.vu::after { content: ' ✓'; color: var(--gold); }
    .memoire-relation { color: var(--text-dim); font-size: 12px; }
    .memoire-vide, .memoire-attente { padding: 40px; text-align: center; color: var(--text-dim); }
    .memoire-lien { stroke: rgba(201, 168, 76, 0.32); }
    .memoire-bulle { cursor: pointer; transition: opacity 0.25s; }
    .memoire-bulle .memoire-anneau { fill: none; stroke: rgba(232, 223, 200, 0.55); stroke-width: 1.5; }
    .memoire-bulle:hover .memoire-anneau, .memoire-bulle.choisie .memoire-anneau { stroke: var(--gold); stroke-width: 3; }
    .memoire-bulle.decouvrir { opacity: 0.42; }
    .memoire-bulle.decouvrir .memoire-anneau { stroke-dasharray: 4 3; }
    .memoire-icone { text-anchor: middle; fill: #f3ead6; pointer-events: none; }
    .memoire-nom { fill: var(--text); font: 12px Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: #0c0a08; stroke-width: 4px; pointer-events: none; }
    .memoire-episode .memoire-nom { fill: var(--gold); font-style: italic; font-size: 13px; }
    .memoire-bulle.estompe, .memoire-lien.estompe { opacity: 0.12; }
    .memoire-cadenas { font-size: 12px; pointer-events: none; }
    .memoire-progression { display: flex; gap: 16px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); }
    .memoire-anneau-total { width: 64px; height: 64px; flex: none; }
    .memoire-anneau-total .fond { fill: none; stroke: var(--border); stroke-width: 5; }
    .memoire-anneau-total .plein { fill: none; stroke: var(--gold); stroke-width: 5; stroke-linecap: round; }
    .memoire-anneau-total text { fill: var(--gold); font: bold 10px Georgia, serif; }
    .memoire-barres { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 18px; }
    .memoire-barre { display: grid; grid-template-columns: 112px 1fr auto; gap: 8px; align-items: center; font-size: 12px; color: var(--text-dim); }
    .memoire-barre i { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
    .memoire-barre b { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
    .memoire-barre small { font-size: 11px; white-space: nowrap; }
    #memoire-toast {
      position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 20px); z-index: 40;
      padding: 10px 18px; border-radius: 999px; border: 1px solid var(--gold-dim);
      background: rgba(12, 10, 8, 0.92); color: var(--text); font: 14px Georgia, serif;
      opacity: 0; pointer-events: none; transition: opacity 0.4s, transform 0.4s; max-width: calc(100vw - 32px);
    }
    #memoire-toast.visible { opacity: 1; transform: translate(-50%, 0); }
    #memoire-toast strong { color: var(--gold); font-weight: normal; }
    @media (max-width: 760px) {
      .memoire-corps { flex-direction: column; }
      .memoire-panneau { width: auto; max-height: 50%; border-left: none; border-top: 1px solid var(--border); }
    }
    /* Nom de l'objet survolé, près du curseur */
    #poi-label {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      padding: 3px 9px;
      border-radius: 6px;
      background: rgba(12, 10, 8, 0.85);
      border: 1px solid rgba(201, 168, 76, 0.4);
      color: var(--gold);
      font: italic 13px Georgia, serif;
      white-space: nowrap;
    }
    #poi-label[hidden] { display: none; }
    #painting-overlay img { max-width: 100%; max-height: calc(100dvh - 140px); object-fit: contain; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
    #painting-caption { text-align: center; color: var(--text); font-family: Georgia, serif; }
    #painting-caption strong { display: block; font-style: italic; font-weight: normal; font-size: 20px; color: var(--gold); }
    #painting-caption small { display: block; margin-top: 4px; font-family: system-ui, sans-serif; font-size: 12px; color: var(--text-dim); }
    #context-bubble:not(.open) #context-count, #context-bubble:not(.open) #context-text { display: none; }
    #context-bubble:not(.has-more) { cursor: default; }
    #context-bubble.has-more::after {
      content: '▾';
      position: absolute;
      right: 10px;
      bottom: 6px;
      font-size: 11px;
      color: var(--gold-dim);
    }
    #context-bubble.has-more.open::after { content: '▴'; }

    #context-count {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      padding-top: 10px;
      border-top: 1px solid rgba(201, 168, 76, 0.22);
    }

    #context-count:empty, #context-text:empty { display: none; }

    #context-text {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-dim);
    }

    /* ── Responsive ──────────────────────────────────────────────────── */
    /* Mobile : l'avatar occupe tout l'écran, en entier. Pas de texte : Napoléon parle, et de chaque
       réponse ne restent que ses lettres, cliquables ; par-dessus, des repères réduits. */
    @media (max-width: 680px) {
      body { display: block; }
      #avatar-panel {
        position: fixed;
        inset: 0;
        border: none;
        /* Clavier ouvert : le navigateur fait défiler la page ; l'avatar compense et reste en place */
        transform: translateY(var(--vv-top, 0px));
      }
      #title-overlay { top: 10px; }
      #title-overlay { width: 100%; }
      #title-overlay h1 { font-size: 13px; letter-spacing: 0.14em; white-space: nowrap; }
      #title-overlay p { display: none; }
      #status-bar {
        top: 34px;
        bottom: auto;
        padding: 4px 10px;
      }
      #status-text { font-size: 10px; }
      #context-bubble {
        top: 66px;
        left: 10px;
        width: calc(100% - 20px);
        padding: 8px 12px;
        gap: 3px;
        border-radius: 10px;
        background: rgba(12, 10, 8, 0.72);
        box-shadow: none;
      }
      #context-episode { font-size: 13px; line-height: 1.3; }
      #context-periode { font-size: 10px; }
      #context-chapitre { font-size: 12px; padding-top: 4px; }
      #context-lettres, #context-count, #context-text { display: none !important; }
      /* Sans épisode, période ni chapitre (ex. lettre tirée au hasard), l'encadré serait vide */
      #context-bubble:not(:has(#context-episode:not(:empty), #context-periode:not(:empty), #context-chapitre:not(:empty))) {
        display: none !important;
      }

      #chat-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: var(--kb, 0px);   /* juste au-dessus du clavier quand il est ouvert */
        max-height: 46dvh;
        z-index: 3;
        border: none;
        background: linear-gradient(to top, rgba(12, 10, 8, 0.96) 55%, rgba(12, 10, 8, 0));
      }
      #chat-header { padding: 4px 10px 0; border: none; }
      #chat-header-row > div:first-child { display: none; }
      #chat-actions {
        flex: 1 1 auto;
        max-width: none;
        justify-content: center;
        gap: 6px;
      }
      #settings-btn { flex-basis: auto; }
      #chat-actions .chat-action { min-height: 28px; padding: 5px 9px; }
      #record-btn { display: none !important; }
      #chat-log {
        flex: 0 1 auto;
        max-height: 30dvh;
        padding: 4px 10px;
        gap: 6px;
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 40%);
        mask-image: linear-gradient(to bottom, transparent, #000 40%);
      }
      #chat-log:not(:has(.has-sources)) { padding: 0; }
      .bubble-user, .bubble-system, .bubble-text { display: none; }
      /* Accueil : la seule bulle de texte gardée, tant que rien n'a été demandé */
      .bubble-system.bubble-welcome {
        display: block;
        align-self: stretch;
        border: none;
        background: rgba(12, 10, 8, 0.6);
        font-family: Georgia, serif;
        font-size: 14px;
        line-height: 1.45;
        color: var(--text);
      }
      .bubble-welcome .bubble-text { display: block; }
      #chat-log:has(.bubble-welcome) { padding: 4px 10px; -webkit-mask-image: none; mask-image: none; }

      /* Sous-titres : deux lignes au plus, le texte monte au fil de la voix */
      #subtitles {
        display: block;
        order: -1;   /* au-dessus des boutons, au plus près de Napoléon */
        position: relative;
        margin: 0 14px;
        height: 0;
        overflow: hidden;
        font-family: Georgia, serif;
        font-size: 16px;
        line-height: 1.4;
        text-align: center;
        color: rgba(232, 223, 200, 0.55);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
        opacity: 0;
        transition: opacity 0.4s, height 0.3s;
      }
      #subtitles.visible { height: 2.8em; opacity: 1; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      /* Petit chevron : le texte se déplie au toucher */
      #subtitles.visible::after {
        content: '⌄';
        position: absolute;
        right: 0;
        bottom: 0;
        font-size: 14px;
        line-height: 1;
        color: var(--gold-dim);
        pointer-events: none;
      }
      /* Déplié : tout le texte, sur fond sombre, défilement au doigt */
      #subtitles.visible.expanded {
        height: auto;
        max-height: 42vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--gold-dim) transparent;
        padding: 10px 14px 18px;
        border-radius: 10px;
        background: rgba(12, 10, 8, 0.82);
        text-align: left;
        color: var(--text);
      }
      #subtitles.expanded::after { content: '⌃'; position: sticky; display: block; text-align: right; bottom: -12px; }
      #subtitles.expanded .subtitles-inner { transform: none !important; }
      .subtitles-inner { position: relative; transition: transform 0.45s ease; }
      .subtitles-inner span { transition: color 0.2s; }
      .subtitles-inner span.said { color: var(--text); }
      .keyboard-open #subtitles { display: none; }
      /* seules les lettres de la dernière réponse restent à l'écran */
      .bubble-napoleon:not(.latest-sources) { display: none; }
      .bubble-napoleon {
        max-width: 100%;
        padding: 0;
        background: none;
        border: none;
        font-style: normal;
      }
      .bubble-napoleon .source-toggle {
        width: auto;
        margin: 0;
        padding: 5px 12px;
        border: 1px solid rgba(201, 168, 76, 0.35);
        border-radius: 999px;
        background: rgba(12, 10, 8, 0.7);
        opacity: 1;
      }
      .bubble-napoleon .source-panel {
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(12, 10, 8, 0.88);
        border: 1px solid var(--border);
      }
      .source-panel { gap: 2px; }
      .source-item { padding: 7px 2px; font-size: 12px; }   /* lignes assez hautes pour le doigt */
      .source-item + .source-item { border-top: 1px solid rgba(201, 168, 76, 0.12); }
      .source-date { min-width: 0; font-weight: 500; }
      .source-link { font-size: 0; }
      .source-link::after { content: '↗'; font-size: 13px; }
      #chat-footer {
        padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
        border: none;
      }
      #chat-input { font-size: 16px; padding: 8px 10px; }   /* 16px : pas de zoom automatique sur iOS */
      #send-btn { padding: 8px 12px; }
    }
  </style>
</head>
<body>

  <!-- Avatar panel -->
  <div id="avatar-panel">
    <div id="avatar-canvas"></div>

    <div id="title-overlay">
      <h1>Napoléon Bonaparte</h1>
      <p data-i18n="subtitle">Longwood, Sainte-Hélène · printemps 1821</p>
    </div>

    <div id="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Initialisation…</span>
    </div>

    <button type="button" id="inspect-back" data-i18n="inspectBack" hidden>⤺ Revenir à Napoléon</button>
    <div id="poi-label" hidden></div>
    <div id="letter-overlay" hidden>
      <div id="letter-sheet" role="document"></div>
    </div>
    <div id="painting-overlay" hidden>
      <img id="painting-image" alt="">
      <p id="painting-caption"></p>
    </div>
    <div id="context-bubble" hidden>
      <div id="context-episode"></div>
      <div id="context-periode"></div>
      <div id="context-chapitre"></div>
      <ul id="context-lettres"></ul>
      <p id="context-lacune"></p>
      <div id="context-count"></div>
      <div id="context-text"></div>
    </div>
    <!-- Noms nouveaux de la réponse en cours : ils apparaissent quand la voix les prononce, un clic ouvre leur fiche -->
    <div id="entites-fond" aria-live="polite"></div>
  </div>

  <!-- Chat panel -->
  <div id="chat-panel">
    <div id="chat-header">
      <div id="chat-header-row">
        <div>
          <h2 data-i18n="chatTitle">Dialogue à Longwood</h2>
          <p data-i18n="chatIntro">Interrogez Napoléon sur sa vie, ses campagnes et son exil.</p>
        </div>
        <div id="chat-actions">
          <button type="button" id="settings-btn" class="chat-action" data-i18n="settings">⚙ Paramètres</button>
          <button type="button" id="memory-btn" class="chat-action" data-i18n="memButton">🕮 Mémoire</button>
          <button type="button" id="new-conversation-btn" class="chat-action" data-i18n="newConversation" hidden>↺ Nouvelle conversation</button>
          <button type="button" id="record-btn" class="chat-action" data-i18n="record" hidden>● Enregistrer</button>
        </div>
      </div>
    </div>

    <!-- Sous-titres défilants (mobile) -->
    <div id="subtitles" aria-expanded="false" aria-label="Texte de la réponse : toucher pour le lire en entier"></div>

    <div id="chat-log"></div>

    <div id="chat-footer">
      <form id="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="Posez votre question à Napoléon…"
          autocomplete="off"
          disabled
        />
        <button type="submit" id="send-btn" disabled data-i18n="send">Envoyer</button>
      </form>
    </div>
  </div>


  <!-- Paramètres : langue et clés API (enregistrées dans le .env local) -->
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form" method="dialog">
      <div class="settings-head">
        <h3 id="settings-title" data-i18n="settingsTitle">Paramètres</h3>
        <button type="button" id="settings-close" data-i18n-aria="close" aria-label="Fermer">×</button>
      </div>

      <section class="settings-section">
        <h4 data-i18n="language">Langue</h4>
        <div id="lang-grid"></div>
      </section>

      <section class="settings-section" id="agent-section">
        <h4><span data-i18n="agentTitle">Modèle de l'agent</span> <span class="badge required" data-i18n="required">requis</span></h4>
        <p class="settings-note" data-i18n="agentIntro"></p>
        <label class="key-field">
          <span data-i18n="provider">Fournisseur</span>
          <select id="llm-provider"></select>
        </label>
        <label class="key-field" id="llm-url-field">
          <span data-i18n="baseUrl">URL de l'API</span>
          <input type="url" id="llm-base-url" autocomplete="off" spellcheck="false" placeholder="https://…/v1" />
        </label>
        <label class="key-field" id="llm-key-field">
          <span><span data-i18n="apiKey">Clé API</span><span class="key-state" id="llm-state"></span></span>
          <input type="password" id="llm-key" autocomplete="off" spellcheck="false" />
        </label>
        <div class="model-row">
          <label class="key-field">
            <span data-i18n="agentModel">Modèle de l'archiviste</span>
            <select id="agent-model"></select>
          </label>
          <label class="key-field">
            <span data-i18n="narratorModel">Modèle du narrateur</span>
            <select id="narrator-model"></select>
          </label>
        </div>
        <div class="settings-inline">
          <button type="button" id="llm-load-models" class="chat-action" data-i18n="refreshModels">↻ Actualiser la liste</button>
          <a id="llm-key-link" href="#" target="_blank" rel="noopener" data-i18n="getKey"></a>
        </div>
        <p class="settings-note" data-i18n="modelHint"></p>
        <label class="key-field" id="embedding-field">
          <span><span data-i18n="embeddingKey">Clé OpenAI pour la recherche sémantique</span> <span class="badge" data-i18n="optional">optionnel</span><span class="key-state" id="embedding-state"></span></span>
          <input type="password" id="embedding-key" autocomplete="off" spellcheck="false" />
          <span class="settings-note" data-i18n="embeddingHint"></span>
        </label>
      </section>

      <!-- Voix Azure : utile seulement avec un avatar 3D (synchronisation labiale) ; masquée sinon -->
      <section class="settings-section" id="voice-section" hidden>
        <h4><span data-i18n="voiceTitle">Voix Azure Speech</span> <span class="badge" data-i18n="optional">optionnel</span></h4>
        <p class="settings-note" data-i18n="voiceIntro"></p>
        <label class="key-field">
          <span><span data-i18n="azureKey">Clé Azure Speech</span><span class="key-state" id="azure-state"></span></span>
          <input type="password" id="azure-key" autocomplete="off" spellcheck="false" />
        </label>
        <label class="key-field">
          <span data-i18n="azureRegion">Région Azure</span>
          <input type="text" id="azure-region" autocomplete="off" spellcheck="false" placeholder="francecentral" />
        </label>
        <p class="settings-note">
          <a href="https://portal.azure.com/#create/Microsoft.CognitiveServicesSpeechServices" target="_blank" rel="noopener" data-i18n="getAzureKey"></a>
        </p>
      </section>

      <section class="settings-section" id="avatar-section">
        <h4><span data-i18n="avatarTitle">Avatar 3D</span> <span class="badge" data-i18n="optional">optionnel</span></h4>
        <p class="settings-note" id="avatar-note"></p>
      </section>

      <div class="settings-actions" id="settings-actions">
        <span id="settings-message" class="settings-message" role="status"></span>
        <button type="submit" id="settings-save" class="chat-action primary" data-i18n="save">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/terms.js"></script>
</body>
</html>
