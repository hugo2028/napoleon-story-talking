<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Napoléon Bonaparte — Avatar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

    :root {
      --gold: #c9a84c;
      --gold-dim: #8a6f34;
      --bg: #0c0a08;
      --surface: #15120d;
      --surface2: #1d1810;
      --border: #2e2618;
      --text: #e8dfc8;
      --text-dim: #9a8e78;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: grid;
      grid-template-columns: 1fr 380px;
      grid-template-rows: 1fr;
      gap: 0;
      overflow: hidden;
    }

    /* ── Avatar panel ────────────────────────────────────────────────── */
    #avatar-panel {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    #avatar-canvas {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 35% 25%, #2a1f0d 0%, #120e08 55%, #0c0a08 100%);
    }

    #avatar-canvas canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Title overlay */
    #title-overlay {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 2;
    }

    #title-overlay h1 {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 2px 12px rgba(201, 168, 76, 0.35);
    }

    #title-overlay p {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-top: 4px;
    }

    /* Status bar */
    #status-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 12, 8, 0.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 76, 0.25);
      white-space: nowrap;
      z-index: 2;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold-dim);
      flex: 0 0 auto;
      transition: background 0.3s;
    }

    .status-dot.ready {
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2);
    }

    #status-text {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    /* ── Chat panel ──────────────────────────────────────────────────── */
    #chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background: var(--surface2);
      border-left: 1px solid var(--border);
    }

    #chat-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    #chat-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    #chat-header h2 {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    #chat-header p {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
      font-family: system-ui, sans-serif;
      line-height: 1.4;
    }

    #chat-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
      max-width: 180px;
    }

    .chat-action {
      min-height: 32px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 11px;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    #lang-picker {
      position: relative;
      flex-basis: 100%;
    }

    #lang-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    #lang-button .caret {
      font-size: 9px;
      color: var(--text-dim);
    }

    .flag {
      width: 18px;
      height: 12px;
      flex: 0 0 auto;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    #lang-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 20;
      min-width: 100%;
      margin: 0;
      padding: 4px;
      list-style: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    #lang-menu[hidden] { display: none; }

    #lang-menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: none;
      border: 0;
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-family: system-ui, sans-serif;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }

    #lang-menu button:hover,
    #lang-menu button:focus-visible,
    #lang-menu button[aria-selected="true"] {
      background: rgba(201, 168, 76, 0.12);
      color: var(--gold);
      outline: none;
    }

    #record-btn.recording {
      color: #ff6b5e;
      border-color: rgba(255, 107, 94, 0.6);
      background: rgba(255, 107, 94, 0.12);
      animation: record-pulse 1.6s ease-in-out infinite;
    }

    @keyframes record-pulse {
      50% { border-color: rgba(255, 107, 94, 0.2); }
    }

    @media (prefers-reduced-motion: reduce) {
      #record-btn.recording { animation: none; }
    }

    .chat-action.primary {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(201, 168, 76, 0.12);
    }

    .chat-action:hover:not(:disabled) {
      border-color: var(--gold-dim);
      color: var(--gold);
    }

    .chat-action:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    #chat-log {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .bubble {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
      font-family: system-ui, sans-serif;
    }

    .bubble-user {
      align-self: flex-end;
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid rgba(201, 168, 76, 0.25);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }

    .bubble-napoleon {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
      font-style: italic;
    }

    .source-toggle {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding-top: 7px;
      border: none;
      border-top: 1px solid rgba(201, 168, 76, 0.15);
      background: none;
      text-align: left;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0.6;
      font-style: normal;
      transition: opacity 0.15s;
    }
    .source-toggle:hover { opacity: 1; }

    .source-panel {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .source-panel[hidden] { display: none; }

    .source-item {
      display: flex;
      gap: 8px;
      align-items: baseline;
      font-size: 11px;
      font-style: normal;
    }
    .source-date {
      color: var(--gold);
      font-weight: 600;
      min-width: 86px;
      flex-shrink: 0;
    }
    .source-snippet {
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .source-link {
      color: var(--gold);
      opacity: 0.7;
      text-decoration: none;
      flex-shrink: 0;
      font-size: 10px;
      letter-spacing: 0.03em;
    }
    .source-link:hover { opacity: 1; text-decoration: underline; }

    .bubble-system {
      align-self: center;
      max-width: 100%;
      background: transparent;
      border: 1px solid rgba(201, 168, 76, 0.18);
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      font-style: normal;
    }

    /* Chat form */
    #chat-footer {
      flex: 0 0 auto;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }

    #chat-form {
      display: flex;
      gap: 8px;
    }

    #chat-input {
      flex: 1 1 auto;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
    }

    #chat-input:focus {
      border-color: var(--gold-dim);
    }

    #chat-input::placeholder {
      color: var(--text-dim);
    }

    #chat-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #send-btn {
      flex: 0 0 auto;
      padding: 10px 16px;
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      color: var(--gold);
      font-size: 13px;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      letter-spacing: 0.04em;
    }

    #send-btn:hover:not(:disabled) {
      background: rgba(201, 168, 76, 0.22);
    }

    #send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Context bubble ──────────────────────────────────────────────── */
    #context-episode {
      font-size: 20px;
      line-height: 1.3;
      color: var(--gold);
      text-shadow: 0 2px 10px rgba(201, 168, 76, 0.25);
    }

    #context-periode {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold-dim);
    }

    #context-chapitre {
      font-size: 16px;
      line-height: 1.4;
      font-style: italic;
      color: var(--text);
      padding-top: 10px;
      border-top: 1px solid rgba(201, 168, 76, 0.22);
    }

    #context-episode:empty, #context-periode:empty,
    #context-chapitre:empty, #context-lettres:empty { display: none; }

    #context-lettres {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-dim);
    }

    .context-letter-date {
      color: var(--gold);
      font-weight: 600;
    }

    /* Grand encadré de repères, sans défilement : il prend la hauteur de son contenu */
    #context-bubble {
      position: absolute;
      top: 20px;
      left: 20px;
      width: clamp(280px, 30%, 420px);
      padding: 18px 22px;
      border-radius: 14px;
      background: rgba(12, 10, 8, 0.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 168, 76, 0.28);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: visible;
    }

    #context-bubble[hidden] { display: none; }

    #context-count {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      padding-top: 10px;
      border-top: 1px solid rgba(201, 168, 76, 0.22);
    }

    #context-count:empty, #context-text:empty { display: none; }

    #context-text {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-dim);
    }

    /* ── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 680px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: 55vh 1fr;
      }
      #context-bubble {
        top: 72px;
        left: 12px;
        width: calc(100% - 24px);
        padding: 12px 14px;
        gap: 6px;
      }
      #context-episode { font-size: 16px; }
      #context-chapitre, #context-lettres, #context-text { font-size: 13px; }
      #avatar-panel {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      #chat-panel {
        border-left: none;
      }
      #chat-header-row {
        align-items: stretch;
        flex-direction: column;
      }
      #chat-actions {
        justify-content: flex-start;
        max-width: none;
      }
    }
  </style>
</head>
<body>

  <!-- Avatar panel -->
  <div id="avatar-panel">
    <div id="avatar-canvas"></div>

    <div id="title-overlay">
      <h1>Napoléon Bonaparte</h1>
      <p data-i18n="subtitle">Empereur des Français · 1769 – 1821</p>
    </div>

    <div id="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Initialisation…</span>
    </div>

    <div id="context-bubble" hidden>
      <div id="context-episode"></div>
      <div id="context-periode"></div>
      <div id="context-chapitre"></div>
      <ul id="context-lettres"></ul>
      <div id="context-count"></div>
      <div id="context-text"></div>
    </div>
  </div>

  <!-- Chat panel -->
  <div id="chat-panel">
    <div id="chat-header">
      <div id="chat-header-row">
        <div>
          <h2 data-i18n="chatTitle">Dialogue impérial</h2>
          <p data-i18n="chatIntro">Interrogez l'Empereur sur sa vie, ses campagnes et son empire.</p>
        </div>
        <div id="chat-actions">
          <div id="lang-picker">
            <button type="button" id="lang-button" class="chat-action" aria-haspopup="listbox"
                    aria-expanded="false" data-i18n-aria="language" aria-label="Langue"></button>
            <ul id="lang-menu" role="listbox" hidden></ul>
          </div>
          <button type="button" id="start-conversation-btn" class="chat-action primary" data-i18n="start">Commencer</button>
          <button type="button" id="end-conversation-btn" class="chat-action" data-i18n="end">Finir</button>
          <button type="button" id="reset-conversation-btn" class="chat-action" data-i18n="reset">Reset</button>
          <button type="button" id="record-btn" class="chat-action" data-i18n="record">● Enregistrer</button>
        </div>
      </div>
    </div>

    <div id="chat-log"></div>

    <div id="chat-footer">
      <form id="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="Posez votre question à l'Empereur…"
          autocomplete="off"
          disabled
        />
        <button type="submit" id="send-btn" disabled data-i18n="send">Envoyer</button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
